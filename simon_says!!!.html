<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says!!!!</title>
    <link rel="stylesheet" href="simon_says!!1.css">
</head>
<body>
    <h1 style="color: rgb(rgb(110, 83, 83), green, blue);">Simon Says Game</h1>
    <div class="difficulty">
        <button type="button" id="easy">Easy</button>
        <button type="button" id="hard">Hard</button>
    </div>
    <h2 style="background-color: red;">Press any key to start the game.</h2>
    <div class="btn-container" id="game-board">
        <div class="line-1">
            <div class="btn red" type="button" id="red">RED</div>
            <div class="btn yellow" type="button" id="yellow">YELLOW</div>
        </div>

        <div class="line-2">  
            <div class="btn green" type="button" id="green">GREEN</div>
            <div class="btn purple" type="button" id="purple">PURPLE</div>
        </div>

    </div>
    <script src="simon_says!!!.js"></script>
    
</body>
</html>
